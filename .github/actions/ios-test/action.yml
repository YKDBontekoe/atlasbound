name: iOS test suite
description: Boot simulator and run xcodebuild test-without-building from shared test products.

inputs:
  result-bundle:
    description: Path for the xcresult bundle
    required: false
    default: TestResults.xcresult
  upload-artifact-name:
    description: Artifact name for test results and snapshots; empty skips upload
    required: false
    default: atlasbound-test-results
  artifact-retention-days:
    description: Artifact retention in days
    required: false
    default: "7"
  only-testing:
    description: Whitespace-separated XCTest identifiers; empty runs the complete scheme
    required: false
    default: ""
  extra-xcodebuild-args:
    description: Extra arguments passed to xcodebuild test
    required: false
    default: ""
  mode:
    description: CI_TEST_MODE value — test (default in CI), all, or build
    required: false
    default: test
  test-products-path:
    description: Path to .xctestproducts used when mode=test
    required: false
    default: dist/Atlasbound.xctestproducts
  test-products-artifact:
    description: Name of the uploaded test-products artifact to download; empty skips download
    required: false
    default: atlasbound-test-products

runs:
  using: composite
  steps:
    - name: Start simulator early
      if: inputs.mode == 'test'
      shell: bash
      run: |
        set -euo pipefail
        # Overlap cold boot with artifact download / unpack.
        SIMULATOR_NAME="$(
          xcrun simctl list devices available -j | python3 -c '
import json, sys
data = json.load(sys.stdin)
devices = []
for runtime, items in data.get("devices", {}).items():
    if "iOS" not in runtime:
        continue
    for device in items:
        if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
            devices.append(device["name"])
preferred = ["iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro"]
for name in preferred:
    if name in devices:
        print(name)
        raise SystemExit(0)
if not devices:
    raise SystemExit("No available iPhone simulators")
print(devices[0])
'
        )"
        echo "SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
        echo "Pre-booting simulator: $SIMULATOR_NAME"
        xcrun simctl boot "$SIMULATOR_NAME" 2>/dev/null || true

    - name: Download test products
      if: inputs.mode == 'test' && inputs.test-products-artifact != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.test-products-artifact }}
        path: dist

    - name: Unpack test products
      if: inputs.mode == 'test' && inputs.test-products-artifact != ''
      shell: bash
      env:
        TEST_PRODUCTS_PATH: ${{ inputs.test-products-path }}
      run: |
        set -euo pipefail
        mkdir -p dist
        ARCHIVE=""
        if [[ -f dist/Atlasbound.testproducts.tgz ]]; then
          ARCHIVE=dist/Atlasbound.testproducts.tgz
        elif [[ -f dist/Atlasbound.xctestproducts.tgz ]]; then
          ARCHIVE=dist/Atlasbound.xctestproducts.tgz
        else
          echo "Packed test products not found under dist/" >&2
          find dist -maxdepth 3 -print >&2 || true
          exit 1
        fi
        tar -C dist -xzf "$ARCHIVE"
        if [[ -e "$TEST_PRODUCTS_PATH" ]]; then
          echo "Using test products at ${TEST_PRODUCTS_PATH}"
        elif [[ -d dist/TestProducts ]]; then
          echo "Using xctestrun fallback under dist/TestProducts"
        else
          echo "Missing products after unpack" >&2
          find dist -maxdepth 3 -print >&2 || true
          exit 1
        fi

    - name: Run tests
      shell: bash
      env:
        RESULT_BUNDLE: ${{ inputs.result-bundle }}
        ONLY_TESTING: ${{ inputs.only-testing }}
        EXTRA_XCODEBUILD_ARGS: ${{ inputs.extra-xcodebuild-args }}
        CI_TEST_MODE: ${{ inputs.mode }}
        TEST_PRODUCTS_PATH: ${{ inputs.test-products-path }}
      run: |
        set -euo pipefail
        chmod +x scripts/ci-run-tests.sh
        args=()
        if [[ -n "$ONLY_TESTING" ]]; then
          read -r -a test_identifiers <<< "$ONLY_TESTING"
          for identifier in "${test_identifiers[@]}"; do
            args+=("-only-testing:${identifier}")
          done
        fi
        if [[ -n "$EXTRA_XCODEBUILD_ARGS" ]]; then
          # shellcheck disable=SC2086
          args+=($EXTRA_XCODEBUILD_ARGS)
        fi
        ./scripts/ci-run-tests.sh "${args[@]}"

    - name: Upload test results
      if: inputs.upload-artifact-name != '' && always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.upload-artifact-name }}
        path: |
          ${{ inputs.result-bundle }}
          AtlasboundTests/Visual/__Snapshots__
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}
