name: iOS test suite
description: Boot simulator, bootstrap snapshots if needed, and run xcodebuild test.

inputs:
  result-bundle:
    description: Path for the xcresult bundle
    required: false
    default: TestResults.xcresult
  upload-artifact-name:
    description: Artifact name for test results and snapshots; empty skips upload
    required: false
    default: atlasbound-test-results
  artifact-retention-days:
    description: Artifact retention in days
    required: false
    default: "7"
  only-testing:
    description: Whitespace-separated XCTest identifiers; empty runs the complete scheme
    required: false
    default: ""
  extra-xcodebuild-args:
    description: Extra arguments passed to xcodebuild test
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Restore Xcode build cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: atlasbound-xcode-${{ runner.os }}-${{ runner.arch }}-${{ env.ATLASBOUND_XCODE_CACHE_VERSION }}-${{ hashFiles('Atlasbound.xcodeproj/project.pbxproj', 'Atlasbound.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Atlasbound/**/*.swift', 'AtlasboundTests/**/*.swift', 'AtlasboundUITests/**/*.swift') }}
        restore-keys: |
          atlasbound-xcode-${{ runner.os }}-${{ runner.arch }}-${{ env.ATLASBOUND_XCODE_CACHE_VERSION }}-

    - name: Run tests
      shell: bash
      env:
        RESULT_BUNDLE: ${{ inputs.result-bundle }}
        ONLY_TESTING: ${{ inputs.only-testing }}
        EXTRA_XCODEBUILD_ARGS: ${{ inputs.extra-xcodebuild-args }}
      run: |
        set -euo pipefail
        chmod +x scripts/ci-run-tests.sh
        args=()
        if [[ -n "$ONLY_TESTING" ]]; then
          read -r -a test_identifiers <<< "$ONLY_TESTING"
          for identifier in "${test_identifiers[@]}"; do
            args+=("-only-testing:${identifier}")
          done
        fi
        if [[ -n "$EXTRA_XCODEBUILD_ARGS" ]]; then
          # shellcheck disable=SC2086
          args+=($EXTRA_XCODEBUILD_ARGS)
        fi
        ./scripts/ci-run-tests.sh "${args[@]}"

    - name: Upload test results
      if: inputs.upload-artifact-name != '' && always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.upload-artifact-name }}
        path: |
          ${{ inputs.result-bundle }}
          AtlasboundTests/Visual/__Snapshots__
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}
