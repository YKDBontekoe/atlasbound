name: Build IPA & AltStore Source

# Automatic versioning:
# - Marketing version (CFBundleShortVersionString): next semver from latest v* tag
#   (conventional commits: feat→minor, BREAKING→major, else patch)
# - Build number (CFBundleVersion): GitHub run number (always unique for AltStore updates)
# Every push to main publishes a release + refreshes the AltStore source.
# Validation, shared build-for-testing, and the IPA archive start together;
# unit/UI jobs consume the test products. Publishing is the only join point,
# so failed checks can never ship an already-built IPA.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump from latest tag"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - none
      notes:
        description: "What's new (shown in AltStore). Leave empty for auto release notes."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-main
  # Only the newest main commit should publish. Without cancellation, rapid
  # pushes queue entire release workflows behind already-obsolete builds.
  cancel-in-progress: true

jobs:
  test-plan:
    name: Plan test shards
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.matrix.outputs.unit }}
      ui: ${{ steps.matrix.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate balanced test matrices
        id: matrix
        run: |
          UNIT_MATRIX="$(python3 scripts/ci_test_matrix.py \
            --path AtlasboundTests \
            --target AtlasboundTests \
            --shards 1 \
            --granularity class \
            --label unit)"
          UI_MATRIX="$(python3 scripts/ci_test_matrix.py \
            --path AtlasboundUITests \
            --target AtlasboundUITests \
            --shards 1 \
            --granularity method \
            --label ui)"
          echo "unit=$UNIT_MATRIX" >> "$GITHUB_OUTPUT"
          echo "ui=$UI_MATRIX" >> "$GITHUB_OUTPUT"

  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate (privacy, JSON, script tests)
        run: |
          chmod +x scripts/validate-pr.sh scripts/check-privacy-alignment.py
          ./scripts/validate-pr.sh

  build-tests:
    name: Build for testing
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Build test products
        uses: ./.github/actions/ios-build-tests
        with:
          upload-artifact-name: atlasbound-release-test-products
          artifact-retention-days: "14"

  test-unit:
    name: Unit + visual (${{ matrix.name }})
    needs: [test-plan, build-tests]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.unit) }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Run iOS tests
        uses: ./.github/actions/ios-test
        with:
          mode: test
          test-products-artifact: atlasbound-release-test-products
          result-bundle: UnitTestResults-${{ matrix.name }}.xcresult
          only-testing: ${{ matrix.only_testing }}
          upload-artifact-name: atlasbound-release-unit-test-results-${{ matrix.name }}
          artifact-retention-days: "14"

  test-ui:
    name: UI smoke (${{ matrix.name }})
    needs: [test-plan, build-tests]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.ui) }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Run UI tests
        uses: ./.github/actions/ios-test
        with:
          mode: test
          test-products-artifact: atlasbound-release-test-products
          result-bundle: UITestResults-${{ matrix.name }}.xcresult
          only-testing: ${{ matrix.only_testing }}
          upload-artifact-name: atlasbound-release-ui-test-results-${{ matrix.name }}
          artifact-retention-days: "14"

  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      ipa_name: ${{ steps.version.outputs.ipa_name }}
      notes: ${{ steps.version.outputs.notes }}
      bump: ${{ steps.version.outputs.bump }}
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Compute automatic version
        id: version
        env:
          BUMP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
          NOTES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
        run: |
          set -euo pipefail
          chmod +x scripts/auto-version.py
          eval "$(python3 scripts/auto-version.py --bump "${BUMP_INPUT}" | sed 's/^/export /')"

          BUILD="${GITHUB_RUN_NUMBER}"
          IPA_NAME="Atlasbound-${version}+${BUILD}.ipa"
          NOTES="${NOTES_INPUT:-}"
          if [[ -z "$NOTES" ]]; then
            NOTES="Atlasbound ${version} (build ${BUILD}, ${bump} bump)"
          fi

          {
            echo "previous=${previous:-}"
            echo "bump=${bump}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "build=${BUILD}"
            echo "ipa_name=${IPA_NAME}"
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Auto version → ${tag} (bump=${bump}, build=${BUILD})"

      - name: Guard against duplicate tags
        id: guard
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag $TAG already exists — skipping publish (choose a different bump)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build IPA
        if: steps.guard.outputs.publish == 'true'
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          IPA_NAME: ${{ steps.version.outputs.ipa_name }}
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh
          shopt -s nullglob
          IPA_CANDIDATES=(dist/Atlasbound-*.ipa)
          if [[ "${#IPA_CANDIDATES[@]}" -ne 1 ]]; then
            echo "Expected exactly one IPA, found ${#IPA_CANDIDATES[@]}" >&2
            exit 1
          fi
          SOURCE="${IPA_CANDIDATES[0]}"
          if [[ "$(basename "$SOURCE")" != "$IPA_NAME" ]]; then
            mv "$SOURCE" "dist/$IPA_NAME"
          fi
          {
            echo "ipa_path=dist/$IPA_NAME"
            echo "ipa_name=$IPA_NAME"
            echo "version=${MARKETING_VERSION}"
            echo "build=${BUILD_NUMBER}"
            echo "size=$(stat -f%z "dist/$IPA_NAME")"
            echo "sha256=$(shasum -a 256 "dist/$IPA_NAME" | awk '{print $1}')"
          } > dist/ipa-metadata.env

      - name: Upload IPA artifact
        if: steps.guard.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlasbound-ipa
          path: |
            dist/*.ipa
            dist/ipa-metadata.env
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Release + AltStore source
    needs: [validate, test-unit, test-ui, build]
    if: >-
      needs.validate.result == 'success' &&
      needs.test-unit.result == 'success' &&
      needs.test-ui.result == 'success' &&
      needs.build.result == 'success' &&
      needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: atlasbound-ipa
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Atlasbound ${{ needs.build.outputs.version }}
          body: |
            ${{ needs.build.outputs.notes }}

            Auto-versioned (`${{ needs.build.outputs.bump }}` bump). Build `${{ needs.build.outputs.build }}`.
          files: dist/${{ needs.build.outputs.ipa_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Fetch published source history
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}/apps.json"
          mkdir -p altstore
          if curl -fsSL "$PAGES_URL" -o altstore/apps.json.published; then
            echo "Loaded existing source from Pages"
            mv altstore/apps.json.published altstore/apps.json
          else
            echo "No published source yet — using repo template"
            rm -f altstore/apps.json.published
          fi

      - name: Generate AltStore source JSON
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          IPA_NAME: ${{ needs.build.outputs.ipa_name }}
          NOTES: ${{ needs.build.outputs.notes }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"
          ICON_URL="https://${OWNER_LC}.github.io/${REPO}/icon.png"
          WEBSITE="https://github.com/${GITHUB_REPOSITORY}"

          chmod +x scripts/generate-altstore-source.py
          python3 scripts/generate-altstore-source.py \
            --ipa "dist/${IPA_NAME}" \
            --download-url "$DOWNLOAD_URL" \
            --version "$VERSION" \
            --build "$BUILD" \
            --notes "$NOTES" \
            --icon-url "$ICON_URL" \
            --website "$WEBSITE" \
            --input altstore/apps.json \
            --output altstore/apps.json

          python3 -m json.tool altstore/apps.json > /dev/null
          echo "Source URL: https://${OWNER_LC}.github.io/${REPO}/apps.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: altstore

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
