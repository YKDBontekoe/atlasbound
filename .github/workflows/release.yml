name: Build IPA & AltStore Source

# Automatic versioning:
# - Marketing version (CFBundleShortVersionString): next semver from latest v* tag
#   (conventional commits: feat→minor, BREAKING→major, else patch)
# - Build number (CFBundleVersion): GitHub run number (always unique for AltStore updates)
# Every push to main publishes a release + refreshes the AltStore source.
# validate + test must pass before IPA / publish.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump from latest tag"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - none
      notes:
        description: "What's new (shown in AltStore). Leave empty for auto release notes."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate (privacy, JSON, script tests)
        run: |
          chmod +x scripts/validate-pr.sh scripts/check-privacy-alignment.py
          ./scripts/validate-pr.sh

  test:
    name: Unit + visual + UI tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          CANDIDATE="$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "$CANDIDATE" ]]; then
            CANDIDATE="/Applications/Xcode.app"
          fi
          echo "Using $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - name: Resolve simulator destination
        id: sim
        run: |
          set -euo pipefail
          NAME="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = []
          for runtime, items in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in items:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      devices.append(device["name"])
          preferred = ["iPhone 16", "iPhone 16 Pro", "iPhone 15", "iPhone 15 Pro"]
          for name in preferred:
              if name in devices:
                  print(name)
                  raise SystemExit(0)
          if not devices:
              raise SystemExit("No available iPhone simulators")
          print(devices[0])
          ')"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${NAME}"

      - name: Boot simulator and grant location
        run: |
          set -euo pipefail
          NAME="${{ steps.sim.outputs.name }}"
          xcrun simctl boot "$NAME" 2>/dev/null || true
          xcrun simctl bootstatus "$NAME" -b
          xcrun simctl privacy "$NAME" grant location-always com.atlasbound.app || true
          xcrun simctl privacy "$NAME" grant location com.atlasbound.app || true

      - name: Run tests
        run: |
          set -euo pipefail
          DEST="platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"
          xcodebuild test \
            -project Atlasbound.xcodeproj \
            -scheme Atlasbound \
            -destination "$DEST" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlasbound-release-test-results
          path: TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build unsigned IPA
    needs: [validate, test]
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      ipa_name: ${{ steps.version.outputs.ipa_name }}
      notes: ${{ steps.version.outputs.notes }}
      bump: ${{ steps.version.outputs.bump }}
      publish: ${{ steps.guard.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          CANDIDATE="$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "$CANDIDATE" ]]; then
            CANDIDATE="/Applications/Xcode.app"
          fi
          echo "Using $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - name: Compute automatic version
        id: version
        env:
          BUMP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
          NOTES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
        run: |
          set -euo pipefail
          chmod +x scripts/auto-version.py
          eval "$(python3 scripts/auto-version.py --bump "${BUMP_INPUT}" | sed 's/^/export /')"

          BUILD="${GITHUB_RUN_NUMBER}"
          IPA_NAME="Atlasbound-${version}+${BUILD}.ipa"
          NOTES="${NOTES_INPUT:-}"
          if [[ -z "$NOTES" ]]; then
            NOTES="Atlasbound ${version} (build ${BUILD}, ${bump} bump)"
          fi

          {
            echo "previous=${previous:-}"
            echo "bump=${bump}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "build=${BUILD}"
            echo "ipa_name=${IPA_NAME}"
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Auto version → ${tag} (bump=${bump}, build=${BUILD})"

      - name: Guard against duplicate tags
        id: guard
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag $TAG already exists — skipping publish (choose a different bump)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build IPA
        if: steps.guard.outputs.publish == 'true'
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          IPA_NAME: ${{ steps.version.outputs.ipa_name }}
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh
          SOURCE="$(ls dist/Atlasbound-*.ipa | head -1)"
          if [[ "$(basename "$SOURCE")" != "$IPA_NAME" ]]; then
            mv "$SOURCE" "dist/$IPA_NAME"
          fi
          {
            echo "ipa_path=dist/$IPA_NAME"
            echo "ipa_name=$IPA_NAME"
            echo "version=${MARKETING_VERSION}"
            echo "build=${BUILD_NUMBER}"
            echo "size=$(stat -f%z "dist/$IPA_NAME")"
            echo "sha256=$(shasum -a 256 "dist/$IPA_NAME" | awk '{print $1}')"
          } > dist/ipa-metadata.env

      - name: Upload IPA artifact
        if: steps.guard.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlasbound-ipa
          path: |
            dist/*.ipa
            dist/ipa-metadata.env
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Release + AltStore source
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: atlasbound-ipa
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Atlasbound ${{ needs.build.outputs.version }}
          body: |
            ${{ needs.build.outputs.notes }}

            Auto-versioned (`${{ needs.build.outputs.bump }}` bump). Build `${{ needs.build.outputs.build }}`.
          files: dist/${{ needs.build.outputs.ipa_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Fetch published source history
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}/apps.json"
          mkdir -p altstore
          if curl -fsSL "$PAGES_URL" -o altstore/apps.json.published; then
            echo "Loaded existing source from Pages"
            mv altstore/apps.json.published altstore/apps.json
          else
            echo "No published source yet — using repo template"
            rm -f altstore/apps.json.published
          fi

      - name: Generate AltStore source JSON
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          IPA_NAME: ${{ needs.build.outputs.ipa_name }}
          NOTES: ${{ needs.build.outputs.notes }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"
          ICON_URL="https://${OWNER_LC}.github.io/${REPO}/icon.png"
          WEBSITE="https://github.com/${GITHUB_REPOSITORY}"

          chmod +x scripts/generate-altstore-source.py
          python3 scripts/generate-altstore-source.py \
            --ipa "dist/${IPA_NAME}" \
            --download-url "$DOWNLOAD_URL" \
            --version "$VERSION" \
            --build "$BUILD" \
            --notes "$NOTES" \
            --icon-url "$ICON_URL" \
            --website "$WEBSITE" \
            --input altstore/apps.json \
            --output altstore/apps.json

          python3 -m json.tool altstore/apps.json > /dev/null
          echo "Source URL: https://${OWNER_LC}.github.io/${REPO}/apps.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: altstore

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
