name: Build IPA

# PR validation: static checks, unit/snapshot tests, UI tests, and the unsigned
# IPA artifact all run independently so the slowest shard defines elapsed time.
# Releases (with automatic versioning) are handled by "Build IPA & AltStore Source"
# on pushes to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-plan:
    name: Plan test shards
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.matrix.outputs.unit }}
      ui: ${{ steps.matrix.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate balanced test matrices
        id: matrix
        run: |
          UNIT_MATRIX="$(python3 scripts/ci_test_matrix.py \
            --path AtlasboundTests \
            --target AtlasboundTests \
            --shards 4 \
            --granularity class \
            --label unit)"
          UI_MATRIX="$(python3 scripts/ci_test_matrix.py \
            --path AtlasboundUITests \
            --target AtlasboundUITests \
            --shards 5 \
            --granularity method \
            --label ui)"
          echo "unit=$UNIT_MATRIX" >> "$GITHUB_OUTPUT"
          echo "ui=$UI_MATRIX" >> "$GITHUB_OUTPUT"

  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR (privacy, JSON, script tests)
        run: |
          chmod +x scripts/validate-pr.sh scripts/check-privacy-alignment.py
          ./scripts/validate-pr.sh

  test-unit:
    name: Unit + visual (${{ matrix.name }})
    needs: test-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.unit) }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Run iOS tests
        uses: ./.github/actions/ios-test
        with:
          result-bundle: UnitTestResults-${{ matrix.name }}.xcresult
          only-testing: ${{ matrix.only_testing }}
          upload-artifact-name: atlasbound-unit-test-results-${{ matrix.name }}
          artifact-retention-days: "7"

  test-ui:
    name: UI smoke (${{ matrix.name }})
    needs: test-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.ui) }}
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Run UI tests
        uses: ./.github/actions/ios-test
        with:
          result-bundle: UITestResults-${{ matrix.name }}.xcresult
          only-testing: ${{ matrix.only_testing }}
          upload-artifact-name: atlasbound-ui-test-results-${{ matrix.name }}
          artifact-retention-days: "7"

  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Compute automatic version
        id: version
        run: |
          chmod +x scripts/auto-version.py
          eval "$(python3 scripts/auto-version.py --bump auto | sed 's/^/export /')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "PR preview version ${version} (tag would be ${tag})"

      - name: Build IPA
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlasbound-ipa
          path: |
            dist/*.ipa
            dist/ipa-metadata.env
          if-no-files-found: error
          retention-days: 7
