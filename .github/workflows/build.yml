name: Build IPA

# PR validation: static checks, unit/snapshot/UI tests, unsigned IPA artifact.
# Releases (with automatic versioning) are handled by "Build IPA & AltStore Source"
# on pushes to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR (privacy, JSON, script tests)
        run: |
          chmod +x scripts/validate-pr.sh scripts/check-privacy-alignment.py
          ./scripts/validate-pr.sh

  test:
    name: Unit + visual + UI tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Run iOS tests
        uses: ./.github/actions/ios-test
        with:
          upload-artifact-name: atlasbound-test-results
          artifact-retention-days: "7"

  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: ./.github/actions/xcode-select

      - name: Compute automatic version
        id: version
        run: |
          chmod +x scripts/auto-version.py
          eval "$(python3 scripts/auto-version.py --bump auto | sed 's/^/export /')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "PR preview version ${version} (tag would be ${tag})"

      - name: Build IPA
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlasbound-ipa
          path: |
            dist/*.ipa
            dist/ipa-metadata.env
          if-no-files-found: error
          retention-days: 7
